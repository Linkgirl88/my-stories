<script>
'use strict';

/* ───── Theme engine ───── */
const THEMES=[
  {id:'night',   label:'🌙 Night',          font:false},
  {id:'azure',   label:'🌊 Azure (Dyslexic)',font:true},
  {id:'velvet',  label:'🌸 Velvet Dusk',     font:false},
  {id:'latte',   label:'☕ Latte Paper (Dyslexic)',font:true},
];
const OD_URL='https://fonts.cdnfonts.com/css/opendyslexic';

function applyTheme(id){
  const t=THEMES.find(t=>t.id===id)||THEMES[0];
  document.documentElement.dataset.theme=t.id==='night'?'':t.id;
  const link=document.getElementById('odFont');
  if(t.font){link.href=OD_URL;link.disabled=false;}
  else{link.disabled=true;}
  localStorage.setItem('theme',t.id);
}
// Apply saved theme immediately (before first render)
applyTheme(localStorage.getItem('theme')||'night');
/* ───── Google OAuth config ───── */
const GOOG_CLIENT_ID='1048575983251-40ru2sdn6kur5s6d1gb0vk1fs6u7ci5r.apps.googleusercontent.com';
const GOOG_SCOPE='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE='my-stories-data.json';

/* ───── helpers ───── */
// Popup-based OAuth — avoids redirect_uri_mismatch entirely
// The popup opens accounts.google.com; the token comes back via postMessage
const $=s=>document.querySelector(s), main=$('main');
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(typeof v==='function')e[k]=v;
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  e.append(...kids.flat().filter(k=>k!=null&&k!==false));
  return e;
}

/* ───── Google Drive sync ───── */
let gToken=null; // access token (session only)
let driveFileId=null;
let driveData={keys:{},chats:{}}; // persisted data

function googleSignIn(){
  return new Promise((resolve,reject)=>{
    // Use a popup so there's no redirect — avoids redirect_uri_mismatch
    // The redirect_uri must still be registered but just points back to our page
    // Normalize: strip trailing slash to match what's registered in Cloud Console
    const redirectUri=(location.origin+location.pathname).replace(/\/+$/,'');
    const params=new URLSearchParams({
      client_id:GOOG_CLIENT_ID,
      redirect_uri:redirectUri,
      response_type:'token',
      scope:GOOG_SCOPE,
      prompt:'select_account'
    });
    const url='https://accounts.google.com/o/oauth2/v2/auth?'+params;
    const w=800,hh=600,left=(screen.width-w)/2,top=(screen.height-hh)/2;
    const popup=window.open(url,'gauth','width='+w+',height='+hh+',left='+left+',top='+top);
    if(!popup){reject(new Error('Popup blocked — please allow popups for this site'));return;}

    // Poll the popup URL until it redirects back with the token
    const timer=setInterval(()=>{
      try{
        // Once the popup navigates to our origin, we can read its URL
        if(popup.closed){clearInterval(timer);reject(new Error('Sign-in cancelled'));return;}
        const ph=popup.location.hash;
        if(ph&&ph.includes('access_token')){
          clearInterval(timer);
          popup.close();
          const tok=new URLSearchParams(ph.slice(1)).get('access_token');
          if(tok){gToken=tok;sessionStorage.setItem('gtoken',tok);resolve(tok);}
          else reject(new Error('No token returned'));
        }
      }catch(e){/* cross-origin — popup still on Google, keep waiting */}
    },300);
  });
}

function handleOAuthReturn(){
  // Check session storage (token from earlier this session)
  const stored=sessionStorage.getItem('gtoken');
  if(stored){gToken=stored;return true;}
  return false;
}

async function driveReq(method,path,body,contentType){
  const headers={Authorization:'Bearer '+gToken};
  if(contentType)headers['Content-Type']=contentType;
  const r=await fetch('https://www.googleapis.com/'+path,{method,headers,body});
  if(r.status===401){gToken=null;sessionStorage.removeItem('gtoken');}
  return r;
}

async function loadFromDrive(){
  if(!gToken)return false;
  try{
    // Find the file
    const r=await driveReq('GET','drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=name%3D%27'+DRIVE_FILE+'%27');
    if(!r.ok)return false;
    const {files}=await r.json();
    if(!files||!files.length)return false;
    driveFileId=files[0].id;
    const r2=await driveReq('GET','drive/v3/files/'+driveFileId+'?alt=media');
    if(!r2.ok)return false;
    const data=await r2.json();
    driveData=Object.assign({keys:{},chats:{}},data);
    // Restore keys to session
    if(driveData.keys?.ds)sessionStorage.setItem('ds',driveData.keys.ds);
    if(driveData.keys?.el)sessionStorage.setItem('el',driveData.keys.el);
    if(driveData.keys?.or)sessionStorage.setItem('or',driveData.keys.or);
    return true;
  }catch(e){console.warn('Drive load error',e);return false;}
}

async function saveToDrive(){
  if(!gToken)return;
  // Snapshot current keys
  driveData.keys={ds:keys.ds,el:keys.el,or:keys.or};
  const body=JSON.stringify(driveData);
  try{
    if(driveFileId){
      await driveReq('PATCH','upload/drive/v3/files/'+driveFileId+'?uploadType=media',body,'application/json');
    }else{
      // Create new file in appDataFolder
      const meta=JSON.stringify({name:DRIVE_FILE,parents:['appDataFolder']});
      const boundary='boundary_mystories';
      const multipart=`--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${boundary}--`;
      const r=await driveReq('POST','upload/drive/v3/files?uploadType=multipart',multipart,'multipart/related; boundary='+boundary);
      if(r.ok){const d=await r.json();driveFileId=d.id;}
    }
  }catch(e){console.warn('Drive save error',e);}
}

// Save a live chat history to Drive
async function saveChatToDrive(charName,history){
  if(!gToken)return;
  driveData.chats[charName]=history;
  await saveToDrive();
}

function loadChatFromDrive(charName){
  return driveData.chats?.[charName]||[];
}

/* ───── secure key store (sessionStorage — clears when tab closes; also saved to Drive) ───── */
const keys={
  get ds(){return sessionStorage.getItem('ds')||''},
  get el(){return sessionStorage.getItem('el')||''},
  get or(){return sessionStorage.getItem('or')||''},  // OpenRouter
  set ds(v){sessionStorage.setItem('ds',v)},
  set el(v){sessionStorage.setItem('el',v)},
  set or(v){sessionStorage.setItem('or',v)},
  get ready(){return !!(this.ds&&this.el)}
};

/* ───── zip reader ───── */
const dec=new TextDecoder();
async function openZip(file){
  const tailAt=Math.max(0,file.size-65557),tail=new DataView(await file.slice(tailAt).arrayBuffer());
  let p=tail.byteLength-22;while(p>=0&&tail.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error('That does not look like a complete zip file.');
  const count=tail.getUint16(p+10,true),size=tail.getUint32(p+12,true),off=tail.getUint32(p+16,true);
  if(count===0xffff||off===0xffffffff)throw new Error('Zip is too large. Use the slim backup.');
  const cd=await file.slice(off,off+size).arrayBuffer(),v=new DataView(cd),files=new Map();let q=0;
  for(let i=0;i<count;i++){
    const method=v.getUint16(q+10,true),csize=v.getUint32(q+20,true),n=v.getUint16(q+28,true),x=v.getUint16(q+30,true),c=v.getUint16(q+32,true),lo=v.getUint32(q+42,true);
    const name=dec.decode(new Uint8Array(cd,q+46,n));q+=46+n+x+c;
    if(!name.endsWith('/')&&!/secrets\.json$/i.test(name))files.set(name,{method,csize,lo});
  }
  async function blob(name,type){
    const e=files.get(name);if(!e)return null;
    const lh=new DataView(await file.slice(e.lo,e.lo+30).arrayBuffer());
    const start=e.lo+30+lh.getUint16(26,true)+lh.getUint16(28,true),raw=file.slice(start,start+e.csize);
    if(e.method===0)return new Blob([raw],{type});
    if(e.method!==8)throw new Error('Unsupported compression in '+name);
    const buf=await new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return new Blob([buf],{type});
  }
  return{files,blob,text:async n=>{const b=await blob(n);return b?b.text():null}};
}

/* ───── PNG card reader ───── */
function readCard(buf){
  const v=new DataView(buf),u=new Uint8Array(buf),found={};let p=8;
  while(p+8<=u.length){
    const len=v.getUint32(p),type=String.fromCharCode(...u.subarray(p+4,p+8));
    if(type==='tEXt'){const d=u.subarray(p+8,p+8+len),z=d.indexOf(0),key=dec.decode(d.subarray(0,z)).toLowerCase();if(key==='chara'||key==='ccv3')found[key]=d.subarray(z+1)}
    p+=12+len;
  }
  const d=found.ccv3||found.chara;if(!d)throw new Error('no card data');
  const bin=atob(dec.decode(d)),o=JSON.parse(dec.decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));return o.data||o;
}

/* ───── state ───── */
let Z,root='',S={},chars=[],chats=new Map(),groups=[],personas=[],worlds=[],bgs=[],problems=[];
const urls=new Map();
function url(path){
  if(!urls.has(path))urls.set(path,Z.blob(path,/\.png$/i.test(path)?'image/png':/\.gif$/i.test(path)?'image/gif':/\.webp$/i.test(path)?'image/webp':'image/jpeg').then(b=>b?URL.createObjectURL(b):''));
  return urls.get(path);
}
const lazy=new IntersectionObserver(es=>es.forEach(async e=>{
  if(!e.isIntersecting)return;lazy.unobserve(e.target);
  const u=await url(e.target.dataset.path);if(u)e.target.src=u;
}),{rootMargin:'300px'});
function img(path,cls='av'){
  const i=h('img',{class:cls,alt:''});
  if(path&&Z&&Z.files.has(path)){i.dataset.path=path;lazy.observe(i);}
  return i;
}
const under=(dir,ext)=>[...Z.files.keys()].filter(n=>n.startsWith(root+dir+'/')&&n.toLowerCase().endsWith(ext));
const base=n=>n.slice(n.lastIndexOf('/')+1),stem=n=>base(n).replace(/\.[^.]+$/,'');
async function json(n){try{return JSON.parse(await Z.text(n))}catch{problems.push(base(n));return null}}

async function load(file,say){
  urls.forEach(p=>p.then(u=>u&&URL.revokeObjectURL(u)));urls.clear();
  Z=await openZip(file);
  const s=[...Z.files.keys()].filter(n=>n==='settings.json'||n.endsWith('/settings.json')).sort((a,b)=>a.length-b.length)[0];
  if(!s)throw new Error('Could not find SillyTavern settings in this zip.');
  root=s.slice(0,-'settings.json'.length);S=await json(s)||{};
  chars=[];chats=new Map();groups=[];personas=[];worlds=[];problems=[];
  say('Reading characters…');
  for(const p of under('characters','.png')){
    if(p.slice(root.length).split('/').length!==2)continue;
    try{const d=readCard(await(await Z.blob(p)).arrayBuffer());chars.push({path:p,file:base(p),name:d.name||stem(p),d})}
    catch{problems.push(base(p));}
  }
  chars.sort((a,b)=>a.name.localeCompare(b.name));
  for(const p of under('chats','.jsonl')){const k=base(p.slice(0,p.lastIndexOf('/')));if(!chats.has(k))chats.set(k,[]);chats.get(k).push(p);}
  chats.forEach(l=>l.sort().reverse());
  say('Reading groups and lorebooks…');
  for(const p of under('groups','.json')){const g=await json(p);if(g)groups.push(g);}
  const pu=S.power_user||{};
  personas=Object.entries(pu.personas||{}).map(([file,name])=>({file,name,desc:pu.persona_descriptions?.[file]?.description||''})).sort((a,b)=>a.name.localeCompare(b.name));
  worlds=under('worlds','.json').sort();
  bgs=under('backgrounds','').filter(n=>/\.(png|jpe?g|gif|webp)$/i.test(n)).sort();
}

/* ───── voice map ───── */
function voiceIdFor(charName){
  const map=S.extension_settings?.tts?.ElevenLabs?.voiceMap||{};
  const v=map[charName];
  return(!v||v==='[Default Voice]')?null:v;
}
function voiceLabelFor(charName){
  const v=voiceIdFor(charName);return v?v:'not assigned';
}

/* ───── Claude via OpenRouter ───── */
async function askClaude(systemPrompt,userMsg){
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys.or,'HTTP-Referer':'https://linkgirl88.github.io/my-stories','X-Title':'My Stories'},
    body:JSON.stringify({model:'anthropic/claude-sonnet-4-6',messages:[{role:'system',content:systemPrompt},{role:'user',content:userMsg}],max_tokens:2000,temperature:0.3})
  });
  if(!r.ok){const t=await r.text();throw new Error('OpenRouter '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'';
}

/* ───── DeepSeek chat ───── */
// Context window: only send last N messages to API (full history still stored/displayed)
const CONTEXT_WINDOW=40; // messages (20 exchanges)

// Active model — persisted in sessionStorage so it survives page reloads
let activeModel=sessionStorage.getItem('activeModel')||'deepseek-chat';
function setModel(m){activeModel=m;sessionStorage.setItem('activeModel',m);}

const DS_MODELS={
  'deepseek-chat':     {label:'DeepSeek V3 (fast)',    url:'https://api.deepseek.com/chat/completions',key:()=>keys.ds},
  'deepseek-reasoner': {label:'DeepSeek R1 (deep)',    url:'https://api.deepseek.com/chat/completions',key:()=>keys.ds},
};

async function askDeepSeek(systemPrompt,history,userMsg,summary){
  // Windowed context: last CONTEXT_WINDOW messages
  const window=history.slice(-CONTEXT_WINDOW);
  // Build system prompt with optional summary injection
  let fullSys=systemPrompt;
  if(summary)fullSys+='\n\n[STORY SO FAR]\n'+summary;
  const messages=[{role:'system',content:fullSys},...window,{role:'user',content:userMsg}];
  const model=DS_MODELS[activeModel]||DS_MODELS['deepseek-chat'];
  const r=await fetch(model.url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+model.key()},
    body:JSON.stringify({model:activeModel,messages,max_tokens:800,temperature:0.9})
  });
  if(!r.ok){const t=await r.text();throw new Error('DeepSeek '+r.status+': '+t.slice(0,200));}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'';
}

/* ───── Lorebook keyword injection ───── */
// Returns lorebook entries whose keywords appear in recent messages
function matchingLoreEntries(entries,recentText){
  if(!entries)return[];
  return Object.values(entries).filter(e=>{
    if(e.disable||e.enabled===false)return false;
    if(e.constant)return true; // always-on entries
    const keys=(e.key||e.keys||[]);
    return keys.some(k=>k&&recentText.toLowerCase().includes(k.toLowerCase()));
  });
}

// Build lorebook context string from matched entries
function buildLoreContext(c,recentHistory){
  // Check character's linked lorebook and embedded lorebook
  const linked=c.d.extensions?.world;
  const loreEntries=[];
  // Embedded in card
  if(c.d.character_book?.entries)loreEntries.push(...Object.values(c.d.character_book.entries));
  // Linked lorebook file
  if(linked){
    const lp=worlds.find(p=>stem(p)===linked);
    if(lp&&Z?.files?.has(lp)){
      // We'll load it async — for now return what we have from card
    }
  }
  if(!loreEntries.length)return'';
  // Scan last 10 messages for keywords
  const recentText=recentHistory.slice(-10).map(m=>m.content).join(' ');
  const matched=matchingLoreEntries({...loreEntries.map((e,i)=>[i,e]).reduce((o,[i,e])=>(o[i]=e,o),{})},recentText);
  if(!matched.length)return'';
  return'\n\n[LOREBOOK]\n'+matched.map(e=>e.content).filter(Boolean).join('\n---\n');
}

/* ───── API status pinger ───── */
async function pingApi(name,url,headers){
  const t0=Date.now();
  try{
    const r=await fetch(url,{method:'POST',headers,body:'{}',signal:AbortSignal.timeout(5000)});
    // 400/422 = endpoint alive, just bad request (expected)
    const ok=r.status<500;
    return{ok,ms:Date.now()-t0};
  }catch(e){return{ok:false,ms:null};}
}
async function checkApiStatus(){
  const[ds,el,or]=await Promise.all([
    pingApi('ds','https://api.deepseek.com/chat/completions',{'Content-Type':'application/json','Authorization':'Bearer '+keys.ds}),
    pingApi('el','https://api.elevenlabs.io/v1/voices',{'xi-api-key':keys.el}),
    pingApi('or','https://openrouter.ai/api/v1/models',{'Authorization':'Bearer '+keys.or}),
  ]);
  return{ds,el,or};
}

/* ───── ElevenLabs TTS ───── */
let currentAudio=null;
let audioCtx=null;
function unlockAudio(){
  // Must be called synchronously inside a user gesture to unlock autoplay
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
  if(audioCtx.state==='suspended')audioCtx.resume();
}
async function speak(text,voiceId){
  if(!voiceId)return;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+voiceId,{
    method:'POST',
    headers:{'Content-Type':'application/json','xi-api-key':keys.el},
    body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:0.5,similarity_boost:0.75}})
  });
  if(!r.ok){console.warn('ElevenLabs error',r.status);return;}
  const blob=await r.blob();
  const url=URL.createObjectURL(blob);
  const au=new Audio(url);
  au.onended=()=>URL.revokeObjectURL(url);
  currentAudio=au;
  try{await au.play();}catch(e){console.warn('Audio play blocked:',e);}
}

/* ───── navigation ───── */
let stack=[];
function go(fn,title){stack.push({fn,title});history.pushState(stack.length,'');draw();}
function draw(){
  const s=stack.at(-1);
  const old=$('#chatbar');if(old)old.remove();
  main.replaceChildren();
  $('h1').textContent=s.title;
  $('#bg').style.backgroundImage='';
  $('#back').hidden=stack.length<2;
  $('#settingsBtn').hidden=!Z;
  scrollTo(0,0);
  s.fn();
}
addEventListener('popstate',()=>{if(stack.length>1){stack.pop();draw();}});
$('#back').onclick=()=>history.back();
$('#settingsBtn').onclick=()=>go(settingsScreen,'Settings');

const row=(path,title,sub,fn)=>h('button',{class:'row',onclick:fn},path!==null&&img(path),h('span',{},title,sub&&h('small',{},sub)));
function searchable(items,make,text){
  const list=h('div'),show=q=>list.replaceChildren(...items.filter(i=>text(i).toLowerCase().includes(q.toLowerCase())).map(make));
  main.append(h('input',{type:'search',placeholder:'Search',oninput:e=>show(e.target.value)}),list);show('');
}

            h('div',{style:'font-size:12px;opacity:.75;margin-top:4px'},g.map(c=>h('div',{},c.file)).reduce((a,b)=>[a,' ',b]))

    Groups(){

/* ───── Lore Builder ───── */
function loreBuilder(){
  if(!keys.or){
    main.append(
      h('p',{class:'dim'},'Lore Builder uses Claude via OpenRouter to turn your notes and chats into lorebook entries.'),
      h('p',{class:'err'},'⚠ Add your OpenRouter API key in ⚙ Settings first.')
    );return;
  }

  const worldNames=worlds.map(stem);
  const worldSel=h('select',{style:'width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px'},
    h('option',{value:''},'(no specific lorebook)'),
    ...worldNames.map(n=>h('option',{value:n},n))
  );
  // Also offer character names
  const charSel=h('select',{style:'width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px'},
    h('option',{value:''},'(no specific character)'),
    ...chars.map(c=>h('option',{value:c.name},c.name))
  );

  const ta=h('textarea',{placeholder:'Paste your chat log, scene notes, or any raw material here. Claude will pull out facts and create lorebook entries.',style:'width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:160px;margin-bottom:10px;resize:vertical'});
  const out=h('div');
  const btn=h('button',{class:'btn-primary',style:'width:100%;padding:14px;border-radius:12px;font-weight:600;border:none;margin-bottom:10px',onclick:async()=>{
    const raw=ta.value.trim();if(!raw){out.replaceChildren(h('p',{class:'err'},'Paste some material first.'));return;}
    btn.disabled=true;btn.textContent='Claude is reading…';out.replaceChildren(h('p',{class:'typing'},'Pulling out lore entries…'));
    const world=worldSel.value,char=charSel.value;
    const context=[world&&'Lorebook: '+world,char&&'Main character: '+char].filter(Boolean).join('\n');
    const sys=`You are a SillyTavern lorebook editor. The user will give you raw material — chat logs, scene notes, brainstorming, whatever — and you will extract discrete facts and write them as lorebook entries.

Output ONLY a JSON array of entry objects. Each entry must have:
- "comment": short label (the entry name/title)
- "key": array of 2-5 trigger keywords (lowercase, comma-separated strings)
- "content": the lorebook entry text. Write in second person if describing a character to an AI ("{{char}} is..."), plain prose for world facts. Be specific and factual. Keep each entry focused on ONE fact or concept.
- "constant": false (unless it's a core world fact that should always be included)

Do not include entries for things already obvious from a character card. Focus on specific facts, relationships, history, locations, objects, and events that an AI would need to know to write accurately in this world.

${context}`;
    try{
      const result=await askClaude(sys,raw);
      // Extract JSON from the response
      const match=result.match(/\[[\s\S]*\]/);
      if(!match)throw new Error('Claude did not return a JSON array. Try again or add more material.');
      const entries=JSON.parse(match[0]);
      out.replaceChildren(
        h('p',{class:'drive-status ok'},'✓ '+entries.length+' entries generated — tap any to copy'),
        ...entries.map(e=>{
          const txt=JSON.stringify(e,null,2);
          const card=h('details',{},
            h('summary',{},e.comment||'(untitled)',h('small',{class:'dim'},' — keys: '+(e.key||[]).join(', '))),
            h('div',{class:'txt',style:'font-size:13px;margin:8px 0'},e.content),
            h('button',{style:'margin-top:6px',onclick:()=>navigator.clipboard.writeText(txt).then(()=>{card.querySelector('button').textContent='Copied!';setTimeout(()=>card.querySelector('button').textContent='Copy JSON',1500);})},'Copy JSON')
          );
          return card;
        }),
        h('details',{},
          h('summary',{},'Copy all as JSON array'),
          h('div',{},
            h('button',{onclick:()=>navigator.clipboard.writeText(JSON.stringify(entries,null,2))},'Copy all '+entries.length+' entries'),
            h('pre',{style:'font-size:11px;overflow-x:auto'},JSON.stringify(entries,null,2))
          )
        )
      );
    }catch(e){out.replaceChildren(h('p',{class:'err'},'⚠ '+e.message));}
    finally{btn.disabled=false;btn.textContent='Generate lorebook entries';}
  }},'Generate lorebook entries');

  main.append(
    h('p',{class:'dim'},'Paste raw material — chats, notes, scenes. Claude pulls out facts and formats them as lorebook entries you can copy into SillyTavern.'),
    h('div',{class:'field'},h('label',{},'Lorebook (optional context)'),worldSel),
    h('div',{class:'field'},h('label',{},'Main character (optional context)'),charSel),
    ta,btn,out
  );
}

const sect=(t,v,open)=>v&&h('details',{open:open?'':false},h('summary',{},t),h('div',{class:'txt'},v));
function character(c){
  const d=c.d,m=t=>(t||'').replaceAll('{{char}}',c.name).replaceAll('{{user}}','you'),linked=d.extensions?.world;
  const w=linked&&worlds.find(p=>stem(p)===linked);
  const vid=voiceIdFor(c.name);
  const savedChat=loadChatFromDrive(c.name);
  const chatLabel=savedChat.length?'💬 Continue chat with '+c.name:'💬 Chat with '+c.name;
  const chatBtn=h('button',{class:'btn-primary',style:'width:100%;margin:10px 0;padding:14px;border-radius:12px;font-weight:600;border:none',
    onclick:()=>go(()=>liveChat(c),'Chat with '+c.name)
  },chatLabel);
  main.append(img(c.path,'big'),chatBtn);
  if(savedChat.length)main.append(h('p',{class:'dim drive-status ok'},'✓ '+Math.floor(savedChat.length/2)+' saved exchanges in Drive'));
  main.append(h('p',{class:'dim'},'Voice: '+(vid||'not assigned')),h('h2',{},'Chats'));
  const l=chats.get(stem(c.file))||[];
  if(!l.length)main.append(h('p',{class:'dim'},'No ST chats for this card.'));
  l.forEach(p=>main.append(row(null,stem(p),'',()=>go(()=>chat(p),c.name))));
  main.append(h('h2',{},'Card'));
  main.append(...[sect('Description',m(d.description)),sect('Personality',m(d.personality)),sect('Scenario',m(d.scenario)),sect('First message',m(d.first_mes)),sect('Example messages',m(d.mes_example)),sect('System prompt',m(d.system_prompt))].filter(Boolean));
  if(w)main.append(row(null,'Linked lorebook: '+linked,'',()=>go(()=>lore(w),linked)));
  if(d.character_book?.entries)main.append(row(null,'Lorebook saved inside the card','',()=>go(()=>entries(d.character_book.entries),c.name)));
}

/* ───── LIVE CHAT ───── */
function liveChat(c,importedHistory){
  const d=c.d;
  const vid=voiceIdFor(c.name);

  // Build base system prompt
  const rawSys=(d.system_prompt||'').replaceAll('{{char}}',c.name).replaceAll('{{user}}','the person you are speaking with');
  const sysParts=[rawSys];
  if(d.description)sysParts.push('CHARACTER:\n'+d.description.replaceAll('{{char}}',c.name));
  if(d.personality)sysParts.push('PERSONALITY:\n'+d.personality.replaceAll('{{char}}',c.name));
  if(d.scenario)sysParts.push('SCENARIO:\n'+d.scenario.replaceAll('{{char}}',c.name));
  const baseSystemPrompt=sysParts.filter(Boolean).join('\n\n');

  const avUrl=c.path;
  const msgBox=h('div');

  // Summary storage (from imported ST memory or manually generated)
  let summary=driveData.summaries?.[c.name]||'';

  // Model selector row
  const modelSel=h('select',{style:'font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px',
    onchange(){ setModel(this.value); }
  },
    ...Object.entries(DS_MODELS).map(([k,v])=>h('option',{value:k,...(k===activeModel?{selected:''}:{})},v.label))
  );
  const statusDot=h('span',{title:'API status',style:'font-size:18px;cursor:pointer',onclick:refreshStatusDot},'⚪');
  const contextNote=h('small',{class:'dim',style:'font-size:12px'});
  const chatHeader=h('div',{style:'display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap'},
    modelSel, statusDot, contextNote
  );
  main.append(img(c.path,'big'), chatHeader, msgBox);

  // Ping status on load
  async function refreshStatusDot(){
    statusDot.textContent='⏳';
    const s=await checkApiStatus();
    statusDot.textContent=s.ds.ok?'🟢':'🔴';
    statusDot.title='DeepSeek '+(s.ds.ok?(s.ds.ms+'ms'):'DOWN')+' · ElevenLabs '+(s.el.ok?'OK':'DOWN')+' · OpenRouter '+(s.or.ok?'OK':'DOWN');
  }
  refreshStatusDot();

  // Use imported ST history, or load saved history from Drive, or start fresh with first_mes
  const RENDER_PAGE=20; // messages rendered at a time
  let history;

  // Small speak button for any bubble
  function makeSpeakBtn(text){
    const btn=h('button',{
      style:'background:none;border:none;font-size:14px;padding:2px 4px;opacity:.5;cursor:pointer;float:right',
      title:'Play audio',
      onclick(e){
        e.stopPropagation();
        if(!vid){btn.textContent='🔇';return;}
        unlockAudio(); // must be synchronous inside the gesture
        btn.textContent='⏳';
        speak(stripActions(text),vid).then(()=>btn.textContent='🔊').catch(()=>btn.textContent='⚠');
      }
    },vid?'🔊':'🔇');
    if(!vid)btn.disabled=true;
    return btn;
  }

  // Long-press to delete a message bubble
  // histIdx can be a number (fixed index) or a function returning the current index
  function attachDeletePress(bubble, histIdx){
    let timer;
    const start=()=>{timer=setTimeout(()=>{
      if(!confirm('Delete this message?'))return;
      const idx=typeof histIdx==='function'?histIdx():histIdx;
      if(idx<0||idx>=history.length)return;
      history.splice(idx,1);
      bubble.remove();
      scheduleSave();
    },600);};
    const cancel=()=>clearTimeout(timer);
    bubble.addEventListener('pointerdown',start);
    bubble.addEventListener('pointerup',cancel);
    bubble.addEventListener('pointercancel',cancel);
    bubble.addEventListener('pointermove',cancel);
    bubble.style.cursor='pointer';
  }

  function renderHistory(msgs,offset){
    // Render msgs[offset .. end], with a "Load earlier" button if offset>0
    msgBox.replaceChildren();
    if(offset>0){
      const loadMore=h('button',{style:'display:block;width:100%;margin:8px 0;padding:8px;border-radius:8px;background:var(--card);color:var(--dim);border:1px solid var(--line)',
        onclick(){renderHistory(msgs,Math.max(0,offset-RENDER_PAGE));}
      },'⬆ Load earlier messages ('+(offset)+' above)');
      msgBox.append(loadMore);
    }
    // Render history messages — lightweight (no swipe) except the last assistant msg
    const slice=msgs.slice(offset);
    slice.forEach((m,i)=>{
      const histIdx=offset+i; // actual index in history[]
      const isUser=m.role==='user';
      const isLast=!isUser&&(i===slice.length-1||(i===slice.length-2&&slice[slice.length-1].role==='user'));
      if(isUser){
        const bubble=h('div',{class:'msg me'},h('div',{class:'bubble'},h('b',{},'You'),rich(m.content)));
        attachDeletePress(bubble,histIdx);
        msgBox.append(bubble);
      } else if(isLast){
        const b=addAssistantMsg(c.name,m.content,[m.content]);
        if(b)attachDeletePress(b.el,histIdx);
      } else {
        // Static bubble for older history — no swipe overhead
        const inner=h('div',{class:'bubble'},h('b',{},c.name),makeSpeakBtn(m.content),rich(m.content));
        const bubble=h('div',{class:'msg'},img(avUrl),inner);
        attachDeletePress(bubble,histIdx);
        msgBox.append(bubble);
      }
    });
    scrollTo(0,document.body.scrollHeight);
  }

  if(importedHistory&&importedHistory.length){
    history=importedHistory;
    driveData.chats[c.name]=history;
    saveToDrive();
    const offset=Math.max(0,history.length-RENDER_PAGE);
    renderHistory(history,offset);
    main.append(h('p',{class:'dim drive-status ok'},'↑ Imported '+history.length+' messages from SillyTavern — sending last '+Math.min(history.length,CONTEXT_WINDOW)+' to AI'));
  } else {
    history=loadChatFromDrive(c.name);
  }

  if(!importedHistory&&history.length){
    const offset=Math.max(0,history.length-RENDER_PAGE);
    renderHistory(history,offset);
    main.append(h('p',{class:'dim drive-status ok'},'↑ '+history.length+' messages loaded — sending last '+Math.min(history.length,CONTEXT_WINDOW)+' to AI'));
  } else if(!importedHistory&&!history.length&&d.first_mes){
    const fmes=d.first_mes.replaceAll('{{char}}',c.name).replaceAll('{{user}}','you');
    addMsg(c.name,fmes,false,false);
    history=[{role:'assistant',content:fmes}];
  }

  updateContextNote();
  function updateContextNote(){
    const sending=Math.min(history.length,CONTEXT_WINDOW);
    contextNote.textContent=history.length>CONTEXT_WINDOW
      ?'Sending '+sending+'/'+history.length+' msgs'+(summary?' + summary':'')
      :'';
  }

  // Chatbar
  const ta=h('textarea',{placeholder:'Say something…',rows:1,oninput(){this.style.height='auto';this.style.height=this.scrollHeight+'px';}});
  const sendBtn=h('button',{class:'send',onclick:send},'Send');
  const ttsBtn=h('button',{title:vid?'Voice on':'No voice assigned',onclick(){ttsOn=!ttsOn;ttsBtn.textContent=ttsOn?'🔊':'🔇';}},vid?'🔊':'🔇');
  if(!vid)ttsBtn.disabled=true;
  let ttsOn=!!vid;

  // Clear chat button
  const clearBtn=h('button',{title:'Clear chat',onclick:async()=>{
    if(!confirm('Clear saved chat with '+c.name+'? This cannot be undone.'))return;
    history=[];
    if(gToken){driveData.chats[c.name]=[];await saveToDrive();}
    msgBox.replaceChildren();
    if(d.first_mes){
      const fmes=d.first_mes.replaceAll('{{char}}',c.name).replaceAll('{{user}}','you');
      addMsg(c.name,fmes,false,false);
      history=[{role:'assistant',content:fmes}];
    }
    updateContextNote();
  }},'🗑');

  // Summarize older messages button (appears when history > window)
  const sumBtn=h('button',{title:'Summarize older messages',style:'font-size:13px',onclick:summarizeOlder},'📝');

  const bar=h('div',{id:'chatbar'},ta,ttsBtn,clearBtn,sumBtn,sendBtn);
  document.body.append(bar);
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

  if(!keys.ready){addErr('API keys not set. Tap ⚙ in the top-right corner to add them.');sendBtn.disabled=true;}

  // Summarize everything outside the context window
  async function summarizeOlder(){
    if(history.length<=CONTEXT_WINDOW){addErr('Not enough history to summarize yet.');return;}
    const older=history.slice(0,-CONTEXT_WINDOW);
    sumBtn.disabled=true;sumBtn.textContent='⏳';
    try{
      const prompt='Summarize the following story/roleplay conversation between the user and '+c.name+'. Keep key events, character decisions, and emotional beats. Be concise but thorough:\n\n'+
        older.map(m=>(m.role==='user'?'User: ':''+c.name+': ')+m.content).join('\n\n');
      const result=await askDeepSeek('You are a story summarizer. Respond with a concise narrative summary only.',[],prompt);
      summary=result;
      if(!driveData.summaries)driveData.summaries={};
      driveData.summaries[c.name]=summary;
      await saveToDrive();
      updateContextNote();
      main.append(h('div',{class:'box',style:'margin:8px 0'},h('b',{},'📝 Story summary saved'),h('div',{class:'txt',style:'font-size:13px;margin-top:6px'},summary)));
    }catch(e){addErr('Summary failed: '+e.message);}
    finally{sumBtn.disabled=false;sumBtn.textContent='📝';}
  }

  let saveTimer=null;
  function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveChatToDrive(c.name,history),2000);}

  // ── Swipe to regenerate ──
  // Each assistant bubble tracks its alternatives: {alts:[...], idx:0, el}
  let lastAssistantBubble=null;

  async function send(){
    const txt=ta.value.trim();if(!txt||sendBtn.disabled)return;
    unlockAudio(); // unlock before async work so auto-TTS can play
    ta.value='';ta.style.height='auto';
    addMsg('You',txt,true,false);
    history.push({role:'user',content:txt});
    sendBtn.disabled=true;ttsBtn.disabled=true;
    const typing=h('p',{class:'typing'},c.name+' is thinking…');
    msgBox.append(typing);scrollTo(0,document.body.scrollHeight);
    try{
      // Build system prompt with lore + summary
      const loreCtx=buildLoreContext(c,history);
      const systemPrompt=baseSystemPrompt+loreCtx;
      const reply=await askDeepSeek(systemPrompt,history.slice(0,-1),txt,summary);
      typing.remove();
      lastAssistantBubble=addAssistantMsg(c.name,reply,[reply]);
      history.push({role:'assistant',content:reply});
      scheduleSave();updateContextNote();
      if(ttsOn&&vid)speak(stripActions(reply),vid);
    }catch(e){typing.remove();addErr(e.message);}
    finally{sendBtn.disabled=false;if(vid)ttsBtn.disabled=false;}
  }

  // Add a swipeable assistant message
  function addAssistantMsg(name,text,alts){
    let idx=alts.length-1;
    const textDiv=h('div',{class:'txt'},rich(text).firstChild||rich(text));
    const counter=h('small',{class:'dim',style:'font-size:12px'},alts.length>1?(idx+1)+'/'+alts.length:'');

    const prevBtn=h('button',{style:'background:none;border:none;font-size:18px;padding:2px 6px;opacity:.6',
      onclick:async()=>{
        if(idx>0){idx--;showAlt();}
      }
    },'‹');
    const nextBtn=h('button',{style:'background:none;border:none;font-size:18px;padding:2px 6px;opacity:.6',
      onclick:async()=>{
        if(idx<alts.length-1){idx++;showAlt();}
        else{await regenerate();}
      }
    },'›');

    function showAlt(){
      textDiv.replaceChildren(rich(alts[idx]));
      counter.textContent=(idx+1)+'/'+alts.length;
      speakBtn.onclick=e=>{e.stopPropagation();if(!vid)return;speakBtn.textContent='⏳';speak(stripActions(alts[idx]),vid).then(()=>speakBtn.textContent='🔊').catch(()=>speakBtn.textContent='⚠');};
      // Update the history entry for this message
      const histIdx=history.findLastIndex(m=>m.role==='assistant');
      if(histIdx>=0)history[histIdx].content=alts[idx];
      scheduleSave();
    }

    async function regenerate(){
      nextBtn.disabled=true;prevBtn.disabled=true;
      textDiv.textContent=c.name+' is thinking…';
      try{
        const loreCtx=buildLoreContext(c,history);
        const systemPrompt=baseSystemPrompt+loreCtx;
        // History without the last assistant message
        const histForRegen=history.slice(0,-1);
        const lastUser=histForRegen.findLast(m=>m.role==='user');
        const reply=await askDeepSeek(systemPrompt,histForRegen.slice(0,-1),lastUser?.content||'',summary);
        alts.push(reply);idx=alts.length-1;showAlt();
        if(ttsOn&&vid)speak(stripActions(reply),vid);
      }catch(e){textDiv.textContent='Error: '+e.message;}
      finally{nextBtn.disabled=false;prevBtn.disabled=false;}
    }

    const speakBtn=makeSpeakBtn(text);
    const swipeRow=h('div',{style:'display:flex;align-items:center;gap:4px;margin-top:4px'},prevBtn,counter,nextBtn,speakBtn);
    const bubble=h('div',{class:'msg'},
      img(avUrl),
      h('div',{class:'bubble'},h('b',{},name),textDiv,swipeRow)
    );
    msgBox.append(bubble);scrollTo(0,document.body.scrollHeight);
    // Long-press to delete this message
    attachDeletePress(bubble,()=>history.findLastIndex(m=>m.role==='assistant'&&m.content===alts[idx]));
    return{alts,get idx(){return idx},el:bubble};
  }

  function addMsg(name,text,isUser,animate){
    if(!isUser){
      lastAssistantBubble=addAssistantMsg(name,text,[text]);
      return;
    }
    // User message — no swipe needed, also clear swipe from previous assistant msg
    lastAssistantBubble=null;
    const bubble=h('div',{class:'msg me'},
      h('div',{class:'bubble'},h('b',{},name),rich(text))
    );
    // No TTS on user bubbles — just delete
    attachDeletePress(bubble,()=>history.findLastIndex(m=>m.role==='user'&&m.content===text));
    msgBox.append(bubble);scrollTo(0,document.body.scrollHeight);
  }
  function addErr(msg){msgBox.append(h('p',{class:'err'},'⚠ '+msg));scrollTo(0,document.body.scrollHeight);}

  scrollTo(0,document.body.scrollHeight);
}

/* strip action asterisks for TTS */
function stripActions(t){return t.replace(/\*[^*\n]+\*/g,' ').replace(/\s+/g,' ').trim();}

/* ───── rich text renderer ───── */
function rich(t){
  const out=h('div',{class:'txt'});
  for(const part of String(t||'').split(/(\*\*[^*\n]+\*\*|\*[^*\n]+\*|"[^"\n]+"|"[^"\n]+")/)){
    if(!part)continue;
    if(/^\*\*.+\*\*$/.test(part))out.append(h('strong',{},part.slice(2,-2)));
    else if(/^\*.+\*$/.test(part))out.append(h('em',{},part.slice(1,-1)));
    else if(/^[""]/.test(part))out.append(h('q',{},part));
    else out.append(part);
  }
  return out;
}

/* ───── group detail ───── */
function group(g){
  main.append(h('h2',{},'Members'),...(g.members||[]).map(f=>{
    const c=chars.find(c=>c.file===f);
    return row(root+'characters/'+f,c?c.name:stem(f),c?'Voice: '+voiceLabelFor(c.name):'',c?()=>go(()=>character(c),c.name):null);
  }),h('h2',{},'Chats'));
  (g.chats||[]).forEach(id=>{const p=root+'group chats/'+id+'.jsonl';if(Z.files.has(p))main.append(row(null,id,'',()=>go(()=>chat(p),g.name)));});
}

/* ───── lorebook ───── */
async function lore(p){const w=await json(p);if(w)entries(w.entries);else main.append('Could not read this lorebook.');}
function entries(e){
  const list=Object.values(e||{});
  searchable(list,x=>{
    const keys=(x.key||x.keys||[]).join(', ');
    return h('details',{},
      h('summary',{},x.comment||x.name||keys||'(untitled)',(x.disable||x.enabled===false)?' (off)':''),
      h('p',{class:'dim'},x.constant?'Always included':'Keywords: '+(keys||'none')),
      h('div',{class:'txt'},x.content||''));
  },x=>(x.comment||'')+(x.key||x.keys||[]).join(' ')+(x.content||''));
}

/* ───── read-only past chat viewer ───── */
function avatarFor(m,meta){
  const f=m.force_avatar;
  if(f){try{const u=new URL(f,'http://x');const file=u.searchParams.get('file');if(file)return root+(u.searchParams.get('type')==='persona'?'User Avatars/':'characters/')+file;const d=decodeURIComponent(u.pathname.slice(1));if(Z.files.has(root+d))return root+d}catch{}}
  if(m.is_user){const file=meta.persona||personas.find(p=>p.name===m.name)?.file;return file&&root+'User Avatars/'+file;}
  if(m.original_avatar)return root+'characters/'+m.original_avatar;
  return null;
}
async function chat(p){
  const screen=stack.at(-1);main.append('Opening chat…');
  const lines=(await Z.text(p)).split('\n').filter(l=>l.trim());let bad=0;
  const all=lines.map(l=>{try{return JSON.parse(l)}catch{bad++;return null}}).filter(Boolean);
  if(stack.at(-1)!==screen)return;
  const meta=all[0]?.chat_metadata||{},msgs=all[0]?.chat_metadata?all.slice(1):all;
  const folder=base(p.slice(0,p.lastIndexOf('/'))),card=root+'characters/'+folder+'.png';
  const bg=/backgrounds\/([^"')]+)/.exec(meta.custom_background||'');
  if(bg){let f=bg[1];try{f=decodeURIComponent(f)}catch{}url(root+'backgrounds/'+f).then(u=>{if(u&&stack.at(-1)===screen)$('#bg').style.backgroundImage=`url("${u}")`});}
  main.replaceChildren();

  // "Continue this chat" — find the matching character and import history
  const matchChar=chars.find(c=>stem(c.file)===folder);
  if(matchChar){
    const continueBtn=h('button',{class:'btn-primary',style:'width:100%;padding:12px;border-radius:12px;font-weight:600;border:none;margin-bottom:12px',
      onclick:()=>{
        // Convert ST messages to live chat history format, skip system/hidden messages
        const importedHistory=msgs
          .filter(m=>!m.is_system&&m.mes&&m.mes.trim())
          .map(m=>({role:m.is_user?'user':'assistant',content:m.mes}));
        // Store in driveData and go to live chat with this history pre-loaded
        driveData.chats[matchChar.name]=importedHistory;
        go(()=>liveChat(matchChar,importedHistory),'Chat with '+matchChar.name);
      }
    },'▶ Continue this chat with '+matchChar.name);
    main.append(continueBtn);
    main.append(h('p',{class:'dim',style:'font-size:13px;margin:0 0 12px'},'Imports the last '+msgs.filter(m=>!m.is_system).length+' messages into a live session. Saves to Drive automatically.'));
  }

  const memory=msgs.findLast(m=>m.extra?.memory)?.extra.memory;
  if(memory)main.append(sect('Latest summary',memory));
  if(bad)main.append(h('p',{},'Some lines could not be read.'));
  let from=Math.max(0,msgs.length-40);
  const box=h('div');
  const make=m=>h('div',{class:'msg'+(m.is_user?' me':'')+(m.is_system?' hidden':'')},
    img(avatarFor(m,meta)||(m.is_user?null:card)),
    h('div',{class:'bubble'},h('b',{},m.name||''),m.is_system&&h('small',{class:'dim'},' hidden from AI'),rich(m.mes)));
  const more=h('button',{class:'row',onclick:()=>{
    const next=Math.max(0,from-40);box.prepend(...msgs.slice(next,from).map(make));from=next;more.hidden=!from;
  }},'Show earlier messages');
  more.hidden=!from;box.append(...msgs.slice(from).map(make));
  const top=h('button',{onclick:()=>scrollTo(0,document.body.scrollHeight)},'Jump to latest');
  main.append(top,h('p'),more,box);
}


/* ───── settings screen ───── */
function settingsScreen(){
  // Theme picker
  main.append(h('h2',{},'Theme'));
  const currentTheme=localStorage.getItem('theme')||'night';
  const themeBtns=h('div',{class:'btn-row',style:'flex-wrap:wrap'});
  THEMES.forEach(t=>{
    const btn=h('button',{
      style:'flex:1 1 calc(50% - 4px);'+(t.id===currentTheme?'border-color:var(--accent);color:var(--accent)':''),
      onclick(){
        applyTheme(t.id);
        themeBtns.querySelectorAll('button').forEach(b=>b.style.removeProperty('border-color')&&b.style.removeProperty('color'));
        btn.style.borderColor='var(--accent)';btn.style.color='var(--accent)';
      }
    },t.label);
    themeBtns.append(btn);
  });
  main.append(themeBtns,h('p',{class:'dim',style:'font-size:13px'},'Latte Paper is best for bright environments. Azure and Latte use OpenDyslexic font.'));

  // Drive status
  const driveStatus=h('div',{class:'drive-status '+(gToken?'ok':'')},
    gToken?'✓ Connected to Google Drive':'Not connected to Google Drive'
  );
  const driveBtn=h('button',{onclick:async()=>{
    driveBtn.disabled=true;driveBtn.textContent='Opening Google sign-in…';
    try{
      await googleSignIn();
      await loadFromDrive();
      draw(); // refresh settings screen to show new status
    }catch(e){
      driveBtn.disabled=false;driveBtn.textContent=gToken?'Switch Google account':'Connect Google Drive';
      main.append(h('p',{class:'err'},'⚠ '+e.message));
    }
  }},gToken?'Switch Google account':'Connect Google Drive');
  main.append(h('h2',{},'Google Drive'),driveStatus,driveBtn,
    h('p',{class:'dim'},'Drive saves your chats and API keys so they persist between visits.'));

  main.append(h('h2',{},'API Keys'));
  main.append(h('p',{class:'dim'},'Saved to Drive when connected. Otherwise kept only while this tab is open.'));

  const dsIn=h('input',{type:'password',placeholder:'sk-…',value:keys.ds?'••••••••':''});
  const elIn=h('input',{type:'password',placeholder:'your ElevenLabs key',value:keys.el?'••••••••':''});
  const orIn=h('input',{type:'password',placeholder:'sk-or-…',value:keys.or?'••••••••':''});

  main.append(
    h('div',{class:'field'},h('label',{},'DeepSeek API key (chat)'),dsIn),
    h('div',{class:'field'},h('label',{},'ElevenLabs API key (voice)'),elIn),
    h('div',{class:'field'},h('label',{},'OpenRouter API key (Lore Builder)'),orIn)
  );

  main.append(h('div',{class:'btn-row'},
    h('button',{class:'btn-primary',onclick:async function(){
      const dv=dsIn.value.trim(),ev=elIn.value.trim(),ov=orIn.value.trim();
      if(dv&&dv!=='••••••••')keys.ds=dv;
      if(ev&&ev!=='••••••••')keys.el=ev;
      if(ov&&ov!=='••••••••')keys.or=ov;
      if(gToken)await saveToDrive();
      history.back();
    }},'Save'),
    h('button',{onclick(){keys.ds='';keys.el='';keys.or='';dsIn.value='';elIn.value='';orIn.value='';}},'Clear keys')
  ));

  // API status panel
  main.append(h('h2',{},'API Status'));
  const dots={ds:h('span',{},'⚪'),el:h('span',{},'⚪'),or:h('span',{},'⚪')};
  const latencies={ds:h('small',{class:'dim'},''),el:h('small',{class:'dim'},''),or:h('small',{class:'dim'},'')};
  const statusPanel=h('div',{class:'box',style:'display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center'},
    h('span',{},'DeepSeek'),dots.ds,latencies.ds,
    h('span',{},'ElevenLabs'),dots.el,latencies.el,
    h('span',{},'OpenRouter'),dots.or,latencies.or
  );
  const pingBtn=h('button',{onclick:runPing},'Check now');
  main.append(statusPanel,pingBtn,h('p',{class:'dim',style:'font-size:13px'},'Auto-checks when you open a live chat. Enter API keys above first.'));

  async function runPing(){
    pingBtn.disabled=true;dots.ds.textContent=dots.el.textContent=dots.or.textContent='⏳';
    latencies.ds.textContent=latencies.el.textContent=latencies.or.textContent='';
    const s=await checkApiStatus();
    dots.ds.textContent=s.ds.ok?'🟢':'🔴'; latencies.ds.textContent=s.ds.ok?(s.ds.ms+'ms'):'unreachable';
    dots.el.textContent=s.el.ok?'🟢':'🔴'; latencies.el.textContent=s.el.ok?(s.el.ms+'ms'):'unreachable';
    dots.or.textContent=s.or.ok?'🟢':'🔴'; latencies.or.textContent=s.or.ok?(s.or.ms+'ms'):'unreachable';
    pingBtn.disabled=false;
  }
  if(keys.ready||keys.ds||keys.el||keys.or)runPing();

  main.append(h('h2',{},'Voice map'));
  main.append(h('p',{class:'dim'},'From your SillyTavern TTS settings.'));
  const vm=S.extension_settings?.tts?.ElevenLabs?.voiceMap||{};
  const assigned=Object.entries(vm).filter(([,v])=>v&&v!=='[Default Voice]');
  if(!assigned.length){main.append(h('p',{class:'dim'},'No voices assigned in this backup.'));return;}
  assigned.forEach(([name,vid])=>{
    main.append(h('div',{class:'box'},h('b',{},name),h('small',{class:'dim'},vid)));
  });
}

/* ───── start screen ───── */
function start(){
  const status=h('p',{role:'status'});
  const driveInfo=h('p',{class:'drive-status '+(gToken?'ok':'dim')},
    gToken?'✓ Google Drive connected — chats will be saved automatically':'Connect Drive in ⚙ Settings to save chats between visits.'
  );
  const input=h('input',{type:'file',accept:'.zip,application/zip'});
  input.onchange=async()=>{
    const f=input.files[0];if(!f)return;
    status.textContent='Opening your backup…';
    try{
      if(!('DecompressionStream'in self))throw new Error('Please update your browser first.');
      await load(f,t=>status.textContent=t);
      stack=[];tab='Characters';
      go(home,'My Stories');
    }catch(e){status.textContent=e.message;}
    input.value='';
  };
  main.append(
    h('p',{},'Choose your SillyTavern slim backup zip.'),
    h('label',{class:'pick'},'Choose backup zip',input),
    driveInfo,
    status,
    h('div',{class:'box'},'This page only reads your zip. It saves nothing, changes nothing, and sends nothing — until you open a live chat.')
  );
}

/* ───── init ───── */
async function init(){
  // Restore token from this session if still active
  handleOAuthReturn();
  // Try to load Drive data if signed in
  if(gToken) await loadFromDrive();
  stack=[{fn:start,title:'My Stories'}];
  draw();
}

init();
</script>
